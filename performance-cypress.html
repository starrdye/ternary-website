<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Chart - Ternary Cypress Fund</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 1. APPLY AVENIR LIGHT FONT GLOBALLY */
        body {
            font-family: 'Avenir', 'Avenir Next', 'Segoe UI', sans-serif;
            font-weight: 300;
            color: #333;
            margin: 0;
            padding: 0;
            overflow: visible; 
            scroll-behavior: none;
        }

        /* Container Styling */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Headings */
        h2 {
            font-weight: 400;
            color: #003366;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 24px;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        h3 {
            font-weight: 500;
            color: #003366;
            margin-bottom: 15px;
        }
        
        h4 {
            font-weight: 600;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 10px 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }
        h4:first-of-type { margin-top: 0; }

        /* --- UPDATED LAYOUT LOGIC --- */
        .performance-content {
            display: flex;
            flex-wrap: nowrap; 
            align-items: flex-start; 
            gap: 20px;
            width: 100%;
            overflow: visible; 
            scroll-behavior: none;
        }

        .chart-container {
            flex: 2; 
            height: 350px; 
            min-width: 0; 
        }

        .performance-metrics {
            flex: 1; 
            min-width: 220px; 
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            height: 310px; 
            overflow-y: visible; 
            scroll-behavior: none;
        }

        /* Metrics List Styling */
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 5px;
            font-size: 14px;
            white-space: nowrap; 
        }
        li:last-child { border-bottom: none; }
        strong { font-weight: 500; color: #555; margin-right: 10px;}

        /* --- MOBILE TWEAKS --- */
        @media (max-width: 600px) {
            .container { padding: 10px; }
            h2 { font-size: 18px; }
            .performance-metrics { 
                padding: 10px; 
                min-width: 160px; 
            }
            li { font-size: 11px; } 
            h4 { font-size: 10px; margin: 10px 0 5px 0;}
            h3 { font-size: 14px; margin-bottom: 10px;}
        }
    </style>
</head>
<body>

    <section class="performance-section">
        <div class="container">
            <h2>Historical Performance</h2>
            <div class="performance-content">
                <div class="chart-container">
                    <canvas id="performanceChart"></canvas>
                </div>
                
                <div class="performance-metrics">
                    <h3>Performance Metrics</h3>
                    
                    <h4>Returns</h4>
                    <ul>
                        <li><strong>ROI 1Y:</strong> 20.3</li>
                        <li><strong>ROI Since Incept.:</strong> 222.5%</li>
                    </ul>

                    <h4>Risk & Analytics</h4>
                    <ul>
                        <li><strong>Sharpe Ratio:</strong> 1.0</li>
                        <li><strong>CAGR:</strong> 18.9%</li>
                        <li><strong>Alpha (vs S&P):</strong> Positive</li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <script>
        // CHART JS CONFIG
        Chart.defaults.font.family = "'Avenir', 'Avenir Next', 'Segoe UI', sans-serif";
        Chart.defaults.font.weight = '300';
        Chart.defaults.color = '#666';

        const performanceCtx = document.getElementById('performanceChart').getContext('2d');
        
        // Data Calculation for "Latest 4 Quarters" (2025 Full Year + Jan 2026)
        // Base 100 = Dec 31, 2024
        // Cypress Quarterly returns derived from Monthly data: Q1 -2.6%, Q2 +18.0%, Q3 +8.2%, Q4 +10.1%, Jan 26 +12.2%
        // S&P 500 Quarterly returns sourced from market data: Q1 -4.6%, Q2 +10.9%, Q3 +8.1%, Q4 +3.1%, Jan 26 +1.4%

        const performanceChart = new Chart(performanceCtx, {
            type: 'line',
            data: {
                labels: ['Dec 2024', 'Q1 2025', 'Q2 2025', 'Q3 2025', 'Q4 2025', 'Jan 2026'],
                datasets: [
                {
                    label: 'Ternary Cypress Fund',
                    // Cumulative Index: 100 -> 97.4 -> 114.9 -> 124.3 -> 136.9 -> 153.6
                    data: [100, 97.4, 114.9, 124.3, 136.9, 153.6],
                    borderColor: '#003366',
                    backgroundColor: 'rgba(0, 51, 102, 0.1)',
                    pointBackgroundColor: '#003366', 
                    pointBorderColor: '#003366',
                    tension: 0.3,
                    fill: true,
                    borderWidth: 2,
                    pointRadius: 4,
                    pointHoverRadius: 6
                },
                {
                    label: 'S&P 500 (TR)',
                    // Cumulative Index: 100 -> 95.4 -> 105.8 -> 114.4 -> 117.9 -> 119.6
                    data: [100, 95.4, 105.8, 114.4, 117.9, 119.6],
                    borderColor: '#999999',
                    backgroundColor: 'transparent',
                    pointBackgroundColor: '#999999', 
                    pointBorderColor: '#999999',
                    borderDash: [5, 5],
                    tension: 0.3,
                    fill: false,
                    borderWidth: 2,
                    pointRadius: 3,
                    pointHoverRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: 'Cumulative Performance (Indexed to 100)',
                        font: { size: 14, weight: 400 }
                    },
                    legend: {
                        position: 'bottom',
                        labels: { 
                            usePointStyle: true,
                            boxWidth: 8, 
                            boxPadding: 15,
                            padding: 20,
                            font: { size: 12, family: 'Avenir' }
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0, 51, 102, 0.9)',
                        titleFont: { family: 'Avenir', size: 13 },
                        bodyFont: { family: 'Avenir', size: 12 },
                        mode: 'index',
                        intersect: false,
                        callbacks: {
                            label: function(context) {
                                return context.dataset.label + ': ' + context.parsed.y.toFixed(1);
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        grid: { color: '#f0f0f0' },
                        title: { display: false }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { maxRotation: 0, autoSkip: false }
                    }
                }
            }
        });
    </script>
</body>
</html>
